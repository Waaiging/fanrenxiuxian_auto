                const data = await r.json();
                document.getElementById('server-time').innerText = data.server_time;
                
                let html = '';
                window.commandPanelDataMap = {};
                for (const [id, acc] of Object.entries(data.accounts)) {
                    const s = acc.state || {};
                    const isAlive = acc.is_alive;
                    
                    function prettyTime(t, isDate) {
                        if (!t || t === 0 || t === "0" || t === "---") return "未执行";
                        try {
                            // 日期字段（YYYY-MM-DD格式）特殊处理
                            if (isDate && /^\d{4}-\d{2}-\d{2}$/.test(t.toString())) {
                                const today = new Date();
                                const todayStr = today.getFullYear() + '-' + 
                                    String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                                    String(today.getDate()).padStart(2, '0');
                                if (t === todayStr) return "✅ 已执行";
                                return "📅 " + t;
                            }
                            // 统一转化为 Date 对象，兼容 ISO 和 YYYY-MM-DD
                            const date = new Date(t.toString().replace(/-/g, '/')); 
                            if (isNaN(date.getTime())) return t; 
                            
                            const pad = (n) => n.toString().padStart(2, '0');
                            const Y = date.getFullYear();
                            const M = pad(date.getMonth() + 1);
                            const D = pad(date.getDate());
                            const h = pad(date.getHours());
                            const m = pad(date.getMinutes());
                            const s = pad(date.getSeconds());
                            
                            return `${Y}-${M}-${D} ${h}:${m}:${s}`;
                        } catch(e) { return t; }
                    }

                    const commandPanelHtml = renderCommandPanels(id, acc.command_panels || []);

                    let avatarHtml = '';
                    if (s.avatars && Object.keys(s.avatars).length > 0) {
                        const avatarItems = Object.entries(s.avatars).map(([name, val]) => {
                            const usernameText = identityUsername(acc, name);
                            const level = val.level || '未获取';
                            const spiritRoot = val.spirit_root || '灵根未获取';
                            const avatarCurrent = Number(val.current_exp);
                            const avatarTotal = Number(val.total_exp);
                            const expText = Number.isFinite(avatarCurrent) && Number.isFinite(avatarTotal) && avatarTotal > 0
                                ? `${formatNumber(avatarCurrent)} / ${formatNumber(avatarTotal)}`
                                : '修为未获取';
                            
                            // 1. 判断是否当前附身
                            const isAttached = s.current_identity === name;
                            
                            // 2. 解析分身状态：找最近到期的指令
                            let statusText = '空闲';
                            let statusClass = 'avatar-status-idle';
                            const now = new Date();

                            // 收集所有有倒计时的指令
                            const timers = [];
                            if (val.in_deep_meditation && val.deep_meditation_end_time) {
                                try {
                                    const t = new Date(val.deep_meditation_end_time.replace(/-/g, '/'));
                                    if (t > now) timers.push({ label: '深度闭关', time: t });
                                } catch(e){}
                            }
                            const timerFields = [
                                ['next_field_training_time', '野外历练'],
                                ['next_dream_map_time', '入梦寻图'],
                                ['next_heart_trial_time', '共历心劫'],
                                ['next_star_attraction_time', '星辰牵引'],
                                ['next_star_gazing_time', '观星'],
                                ['next_star_shift_time', '改换星移'],
                            ];
                            for (const [key, label] of timerFields) {
                                if (val[key]) {
                                    try {
                                        const t = new Date(val[key].replace(/-/g, '/'));
                                        if (t > now) timers.push({ label, time: t });
                                    } catch(e){}
                                }
                            }

                            if (timers.length > 0) {
                                // 取最近到期的
                                timers.sort((a, b) => a.time - b.time);
                                const nearest = timers[0];
                                const diff = Math.floor((nearest.time - now) / 1000);
                                if (diff > 0) {
                                    const h = Math.floor(diff/3600);
                                    const m = Math.floor((diff%3600)/60);
                                    const s = diff % 60;
                                    statusText = `${nearest.label} (${h}h ${m}m ${s}s)`;
                                    statusClass = 'avatar-status-active';
                                }
                            }
                            
                            // 附身闪烁标识
                            const attachedTag = isAttached 
                                ? `<div style="font-size: 0.65rem; color: #00d2ff; font-weight: 600; margin-top: 0.1rem; animation: pulse 2s infinite;">🔮 附身中</div>` 
                                : '';

                            return `
                                <div class="avatar-item" role="button" tabindex="0" onclick="openIdentityCommands('${escapeJs(id)}', '${escapeJs(name)}')" onkeydown="openIdentityCommandsByKey(event, '${escapeJs(id)}', '${escapeJs(name)}')" style="${isAttached ? 'border-color: rgba(0, 210, 255, 0.6); box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); background: rgba(0, 210, 255, 0.03);' : ''}">
                                    <div class="avatar-name" title="${escapeHtml(name)}${val.nickname ? ' (' + escapeHtml(val.nickname) + ')' : ''}">👤 ${escapeHtml(name)}</div>
                                    ${usernameText ? `<div class="avatar-username" title="${escapeHtml(usernameText)}">${escapeHtml(usernameText)}</div>` : ''}
                                    ${val.nickname ? `<div style="font-size: 0.68rem; color: var(--text-secondary); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${val.nickname}">${val.nickname}</div>` : ''}
                                    ${attachedTag}
                                    <div class="avatar-level" style="margin-top: 0.2rem;">${level}</div>
                                    <div class="avatar-root" title="${spiritRoot}">${spiritRoot}</div>
                                    <div class="avatar-exp" title="${expText}">${expText}</div>
                                    <div class="avatar-status ${statusClass}" style="margin-top: 0.1rem;">
                                        <span class="avatar-status-dot"></span>${statusText}
                                    </div>
                                </div>
                            `;
                        }).join('');
                        avatarHtml = `
                            <div class="avatar-panel">
                                <div class="avatar-title">
                                    <span>身外化身 (${Object.keys(s.avatars).length})</span>
                                    <span style="color: var(--accent-color); font-size: 0.65rem;">🔮 平行挂机中</span>
                                </div>
                                <div class="avatar-grid">
                                    ${avatarItems}
                                </div>
                            </div>
                        `;
                    }
                    const mainUsernameText = identityUsername(acc, '主魂');

                    html += `
                        <div class="card">
                            <div class="main-identity-open" role="button" tabindex="0" onclick="openIdentityCommands('${escapeJs(id)}', '主魂')" onkeydown="openIdentityCommandsByKey(event, '${escapeJs(id)}', '主魂')">
                                <div class="card-header">
                                    <div class="account-name">${acc.name}</div>
                                    <div class="status-badge ${!isAlive ? 'status-offline' : s.is_paused ? 'status-paused' : 'status-online'}">
                                        <span class="live-dot ${!isAlive ? 'dot-offline' : s.is_paused ? 'dot-paused' : 'dot-online'}"></span>
                                        ${!isAlive ? '已停止' : s.is_paused ? '已暂停' : '运行中'}
                                    </div>
                                </div>
                                ${mainUsernameText ? `<div class="identity-username account-username" title="${escapeHtml(mainUsernameText)}">主魂 ${escapeHtml(mainUsernameText)}</div>` : ''}
                                <div class="stat-grid">
                                    <div class="stat-item">
                                        <div class="stat-label">闭关状态</div>
                                        <div class="stat-value active">${s.in_deep_meditation ? '深度闭关中' : '普通闭关'}</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-label">主要进度</div>
                                        <div class="stat-value">${mainProgressText(id, s)}</div>
                                    </div>
                                </div>
                                ${renderCultivation(acc.cultivation, s.level, s.current_exp, s.total_exp, s.spirit_root)}
                            </div>
                            ${avatarHtml}
                            ${commandPanelHtml}
                            <div class="controls">
                                <button class="btn btn-start" onclick="doAction('${id}', 'start')">▶ 启动</button>
                                <button class="btn btn-stop" onclick="doAction('${id}', 'stop')">⏹ 停止</button>
                                <button class="btn btn-restart" onclick="doAction('${id}', 'restart')">🔄 重启</button>
                                <button class="btn btn-clear" onclick="doAction('${id}', 'clear')" title="清除该脚本 35 分钟以前的所有游戏指令（.开头的）">🧹 清屏</button>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('account-cards').innerHTML = html;
                if (commandModalKey) {
                    if (window.commandPanelDataMap?.[commandModalKey]) {
                        renderCommandModal(commandModalKey);
                    } else {
                        closeCommandModal();
                    }
                }
            } catch(e){}
        }

        function splitLogContent(content) {
            if (!content) return [];
            return content.split(/\n(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} \[[A-Z]+\])/g).filter(Boolean);
        }

        function extractLogEntries(data) {
            if (Array.isArray(data.entries)) return data.entries;
            return splitLogContent(data.content || '');
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeJs(text) {
            return String(text || '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '')
                .replace(/\n/g, '\\n');
        }

        function logEntryClass(text) {
            const firstLine = String(text || '').split('\n')[0] || '';
            if (firstLine.includes('[ERROR]') || firstLine.includes('[CRITICAL]')) return 'log-error';
            if (firstLine.includes('[WARNING]')) return 'log-warn';
            if (firstLine.includes('OUT')) return 'log-out';
            if (firstLine.includes('IN')) return 'log-in';
            return '';
        }

        function resetLogState() {
            logState = {lines: [], before: null, hasMore: false, loadingOlder: false, total: 0, matched: 0};
        }

        function updateFilterSummary(statusText = '') {
            const el = document.getElementById('log-filter-summary');
            const parts = [];
            if (currentLogTag) parts.push(`标签 ${currentLogTag}`);
            if (currentLogSearch) parts.push(`搜索 "${currentLogSearch}"`);
            const scope = parts.length ? parts.join('，') : '全部日志';
            const countText = logState.total ? `匹配 ${logState.matched} / ${logState.total} 条` : '暂无记录';
            el.innerText = statusText ? `${scope}\n${statusText}` : `${scope}\n${countText}`;
        }

        function renderLogs(statusText = '') {
            const c = document.getElementById('log-content');
            const topHint = logState.hasMore ? '向上滚动加载更早日志' : '已到日志开头';
            const pieces = [`<div class="log-hint">${escapeHtml(statusText || topHint)}</div>`];
            if (!logState.lines.length) {
                pieces.push('<div class="log-empty">没有匹配的日志。</div>');
            } else {
                for (const entry of logState.lines) {
                    pieces.push(`<div class="log-entry ${logEntryClass(entry)}">${escapeHtml(entry)}</div>`);
                }
            }
            c.innerHTML = pieces.join('');
            updateFilterSummary(statusText);
        }

        async function fetchLogPage(account, before = null, signal = null) {
            const params = new URLSearchParams({limit: String(LOG_PAGE_SIZE)});
            if (before !== null && before !== undefined) params.set('before', String(before));
            if (currentLogTag) params.set('tag', currentLogTag);
            if (currentLogSearch) params.set('q', currentLogSearch);
            const options = {cache: 'no-store'};
            if (signal) options.signal = signal;
            const r = await fetch(`/api/logs/${account}?${params.toString()}`, options);
            return await r.json();
        }

        async function loadLogTags(account) {
            const select = document.getElementById('log-tag-select');
            select.innerHTML = '<option value="">全部标签</option>';
            try {
                const r = await fetch(`/api/log-tags/${account}`, {cache: 'no-store'});
                const data = await r.json();
                for (const item of data.tags || []) {
                    const option = document.createElement('option');
                    option.value = item.tag;
                    option.textContent = item.count ? `${item.tag} (${item.count})` : item.tag;
                    select.appendChild(option);
                }
            } catch (e) {
                console.error('Load log tags failed:', e);
            }
            select.value = currentLogTag;
        }

        async function loadOlderLogs() {
            if (!logState.hasMore || logState.loadingOlder) return;
            const account = currentLogAccount;
            const tag = currentLogTag;
            const search = currentLogSearch;
            const c = document.getElementById('log-content');
            const oldHeight = c.scrollHeight;
            const oldTop = c.scrollTop;
            logState.loadingOlder = true;
            renderLogs('正在加载更早日志...');
            try {
                const data = await fetchLogPage(account, logState.before);
                if (account !== currentLogAccount || tag !== currentLogTag || search !== currentLogSearch) return;
                logState.lines = extractLogEntries(data).concat(logState.lines);
                logState.before = data.next_before;
                logState.hasMore = Boolean(data.has_more);
                logState.total = Number(data.total || 0);
                logState.matched = Number(data.matched || 0);
                renderLogs();
                c.scrollTop = c.scrollHeight - oldHeight + oldTop;
            } catch (e) {
                console.error('Load older logs failed:', e);
                renderLogs('更早日志加载失败，稍后再试');
            } finally {
                logState.loadingOlder = false;
            }
        }

        async function updateLogs(force = false) {
            try {
                const c = document.getElementById('log-content');
                const nearBottom = c.scrollHeight - c.scrollTop <= c.clientHeight + 80;
                if (!force && !nearBottom) return;
                if (logFetchController) logFetchController.abort();
                logFetchController = new AbortController();
                const account = currentLogAccount;
                const tag = currentLogTag;
                const search = currentLogSearch;
                const data = await fetchLogPage(account, null, logFetchController.signal);
                if (account !== currentLogAccount || tag !== currentLogTag || search !== currentLogSearch) return;
                logState.lines = extractLogEntries(data);
                logState.before = data.next_before;
                logState.hasMore = Boolean(data.has_more);
                logState.total = Number(data.total || 0);
                logState.matched = Number(data.matched || 0);
                renderLogs();
                if (force || nearBottom) c.scrollTop = c.scrollHeight;
            } catch(e){
                if (e.name !== 'AbortError') console.error('Log update failed:', e);
            }
        }

        function changeLogTag() {
            currentLogTag = document.getElementById('log-tag-select').value;
            resetLogState();
            document.getElementById('log-content').innerText = '加载中...';
            updateLogs(true);
        }

        function applyLogSearch() {
            currentLogSearch = document.getElementById('log-search-input').value.trim();
            resetLogState();
            document.getElementById('log-content').innerText = '搜索中...';
            updateLogs(true);
        }

        function resetLogFilters() {
            currentLogTag = '';
            currentLogSearch = '';
            document.getElementById('log-tag-select').value = '';
            document.getElementById('log-search-input').value = '';
            resetLogState();
            document.getElementById('log-content').innerText = '加载中...';
            updateLogs(true);
        }

        function switchLog(ev, acc) {
            currentLogAccount = acc;
            currentLogTag = '';
            currentLogSearch = '';
            resetLogState();
            document.querySelectorAll('.log-tab').forEach(t => t.classList.remove('active'));
            ev.target.classList.add('active');
            document.getElementById('log-search-input').value = '';
            document.getElementById('log-content').innerText = '加载中...';
            loadLogTags(acc);
            updateLogs(true);
        }

        setInterval(updateStatus, 5000);
        setInterval(updateLogs, 3000);
        setInterval(updateCommandRecords, 15000);
        document.getElementById('log-search-input').addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') applyLogSearch();
        });
        document.getElementById('log-content').addEventListener('scroll', () => {
            const c = document.getElementById('log-content');
            if (c.scrollTop < 60) loadOlderLogs();
        });
        updateStatus();
        updateCommandRecords();
        loadLogTags(currentLogAccount);
        updateLogs();

        function bindModalEvents() {
            const commandOverlay = document.getElementById('commandModalOverlay');
            if (commandOverlay) {
                commandOverlay.addEventListener('click', function(e) {
                    if (e.target === this) closeCommandModal();
                });
            }
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeCommandModal();
                }
            });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bindModalEvents);
        } else {
            bindModalEvents();
        }
    </script>

    <div class="command-modal-overlay" id="commandModalOverlay">
        <div class="command-modal">
            <div class="command-modal-header">
                <div class="command-modal-title" id="commandModalTitle">指令状态</div>
                <div class="command-modal-close" onclick="closeCommandModal()">×</div>
            </div>
            <div class="command-modal-body" id="commandModalBody"></div>
        </div>
    </div>
</body>
</html>

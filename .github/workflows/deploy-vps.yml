name: Deploy VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 ubuntu@54.153.49.182 "cd /home/ubuntu/deploy && git fetch origin main && git reset --hard origin/main && /home/ubuntu/deploy/venv/bin/python -m py_compile world_boss_features.py tests/test_world_boss_features.py && tmux respawn-pane -k -t xiuxian:0 'cd /home/ubuntu/deploy && source /home/ubuntu/deploy/venv/bin/activate && python3 intelligent_cultivator.py' && tmux respawn-pane -k -t xiuxian:1 'cd /home/ubuntu/deploy && source /home/ubuntu/deploy/venv/bin/activate && python3 sub_cultivator.py' && tmux respawn-pane -k -t xiuxian:2 'cd /home/ubuntu/deploy && source /home/ubuntu/deploy/venv/bin/activate && python3 cultivator_xiaohao.py' && sleep 3 && git rev-parse HEAD && pgrep -af 'intelligent_cultivator.py|sub_cultivator.py|cultivator_xiaohao.py'"
